{% extends "base.html" %}

{% block title %}Health Goals{% endblock %}

{% block content %}
<h2>Select Your Health Goals</h2>

<form method="POST">
    {% csrf_token %}
    <fieldset>
        <legend>Health Goals</legend>
        {{ form.health_goals }}
    </fieldset>

    <button type="submit" class="btn btn-primary">Save Preferences</button>
</form>

{% endblock %}
