<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %} - Personal Diet Plan{% endblock %}</title>
    
    {% load static %}
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">


    <link rel="stylesheet" href="{% static '/style.css' %}">
</head>
<body>

    <div class="header">
        <h1><a href="{% url 'home'%}">Personal Diet Plan</a></h1>
        <ul class="navbar-nav ms-auto flex-row">
            <li class="nav-item">
                <a class="nav-link" href="{% url 'liked_foods' %}">Liked Foods</a>
            </li>
            {% if user.is_authenticated %}
                <li class="nav-item">
                    <a class="nav-link login-btn" href="{% url 'logout' %}">Logout ({{ user.username }})</a>
                </li>
            {% else %}
                <li class="nav-item">
                    <a class="nav-link login-btn" href="{% url 'login' %}">Login</a>
                </li>
            {% endif %}
        </ul>
    </div>

    <div class="content">
        {% block content %}{% endblock %}
    </div>

    <div class="footer">
        <p>&copy; 2025 My Website. All rights reserved.</p>
    </div>


    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js" integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz" crossorigin="anonymous"></script>
</body>
</html>
